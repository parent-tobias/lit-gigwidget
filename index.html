<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + Lit + TS</title>
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="/src/components/Chord/chord.ts"></script>
    <script type="module" src="/src/components/ChordList/chord-list.ts"></script>
  </head>
  <body>
    <chord-list instrument="Standard Ukulele"></chord-list>
    <chord-list instrument="Baritone Ukulele"></chord-list>
    <chord-list instrument="Standard Guitar"></chord-list>
    <chord-list instrument="Standard Mandolin"></chord-list>
    <script>
      // We can simply apply the same set of chords, as an array, to each `chord-list` as an attribute! 
      const chordListEls = document.querySelectorAll("chord-list");
      chordListEls.forEach(chordList=>chordList.chords = ["F#min", "D", "A", "G", "C7"]);
    </script>
  </body>
</html>
